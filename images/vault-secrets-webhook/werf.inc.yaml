---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
fromImage: builder/src
final: false
git:
- add: {{ .ImagePath }}
  to: /src
  stageDependencies:
    install:
    - '**/*'
  excludePaths:
  - .*
  - '**/*_test.go'
  - scripts
  - werf.inc.yaml
shell:
  install:
  - echo "Patches here"
  - touch /src/.nodata
---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}-artifact
fromImage: builder/golang-alt
final: false
import:
- image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
shell:
  install:
  - cd /src
  - export GOPROXY=$(cat /run/secrets/GOPROXY) GOOS=linux GOARCH=amd64 CGO_ENABLED=0
  - |
    {{- include "image-build.build" (set $ "BuildCommand" (printf `go build -ldflags="-s -w" -o %s` $.ImageName)) | nindent 4 }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}
fromImage: base/distroless
git:
{{- include "image mount points" . }}
import:
- image: {{ .ModuleNamePrefix }}{{ .ImageName }}-artifact
  add: /src/{{ .ImageName }}
  to: /usr/bin/{{ .ImageName }}
  before: setup
imageSpec:
  config:
    entrypoint:
    - /usr/bin/{{ .ImageName }}
---
{{- include "vex mitigation" (list $ (printf "%s%s" .ModuleNamePrefix .ImageName)) }}
