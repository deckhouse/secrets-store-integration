---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
fromImage: builder/src
final: false
git:
- add: {{ .ImagePath }}
  to: /src
  stageDependencies:
    install:
    - '**/*'
  includePaths:
  - api/
  - cmd/
  - internal/
  - pkg/
  - go.mod
  - go.sum
  excludePaths:
  - .*
  - '**/*_test.go'
  - werf.inc.yaml
shell:
  install:
  - echo "Patches here"
  - touch /src/.nodata
---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}-artifact
fromImage: builder/golang-alt
final: false
import:
- image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
shell:
  install:
  - export GOPROXY=$(cat /run/secrets/GOPROXY) CGO_ENABLED=0 GOOS=linux GOARCH=amd64
  - cd /src
  - |
    {{- include "image-build.build" (set $ "BuildCommand" (printf `go build -ldflags="-s -w" -o %s cmd/main.go` $.ImageName)) | nindent 4 }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}
fromImage: base/distroless
import:
- image: {{ .ModuleNamePrefix }}{{ .ImageName }}-artifact
  add: /src/{{ .ImageName }}
  to: /usr/bin/{{ .ImageName }}
  before: install
  stage: install
imageSpec:
  config:
    entrypoint:
    - /usr/bin/{{ .ImageName }}
